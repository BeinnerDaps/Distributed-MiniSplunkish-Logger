# Dynamic HOSTNAME: echo 'export HOSTNAME=$(hostname)' >> ~/.bashrc

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ${HOSTNAME}-elasticsearch
    network_mode: "host"
    environment:
      - node.name=${HOSTNAME}
      - cluster.name=${CLUSTER_NAME}
      - network.host=0.0.0.0
      - discovery.seed_hosts=${WORKER_1_IP}:9300,${WORKER_2_IP}:9300,${WORKER_3_IP}:9300
      - cluster.initial_master_nodes=${NODE_NAME1},${NODE_NAME2},${NODE_NAME3}
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"  # Increased to 2GB minimum for 3-node clusters
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: always
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      # Only mark healthy when cluster reaches yellow/green state
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  
  # Worker to Gateway Bridge
  worker_to_gateway:
    build: .
    container_name: ${HOSTNAME}-w2g
    network_mode: "host"
    working_dir: /app
    command: ["python3", "-u", "W2G_node.py"]
    environment:
      - SERVER_NAME=${HOSTNAME}
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
      - NUM_THREADS=${NUM_THREADS}
      - GATEWAY_IP=${GATEWAY_IP}
      - ES_CLUSTER=http://${WORKER_1_IP}:9200,http://${WORKER_2_IP}:9200,http://${WORKER_3_IP}:9200
      - INDEX_NAME=${INDEX_NAME}
      - QUEUE_NAME=${QUEUE_NAME}
      - PYTHONUNBUFFERED=1
    restart: always
    volumes:
      - .:/app
    depends_on:
      elasticsearch:
        condition: service_healthy
    stop_grace_period: 30s
  
  # Worker to Worker Bridge
  # worker_to_worker:
