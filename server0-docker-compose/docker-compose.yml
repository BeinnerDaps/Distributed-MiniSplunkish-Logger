services:
  gateway:
    build: ./gateway
    volumes:
      - ./gateway/logs:/app/logs
    container_name: gateway
    ports:
      - "5000:5000"
    depends_on:
      - etcd

  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.13
    container_name: etcd
    command: >
      etcd
      --advertise-client-urls http://0.0.0.0:2379
      --listen-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
      - "2380:2380"
